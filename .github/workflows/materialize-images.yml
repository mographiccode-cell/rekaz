name: Materialize Rekaz Images

on:
  push:
    paths:
      - '.github/workflows/materialize-images.yml'
      - 'assets/hero-*.b64'
      - 'assets/hqsrc/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create image directory
        run: mkdir -p assets/images

      - name: Rebuild hero from independently encoded binary chunks
        shell: bash
        run: |
          rm -f assets/images/hero.webp
          touch assets/images/hero.webp
          for f in assets/hero-0.b64 assets/hero-1.b64 assets/hero-2.b64 assets/hero-3.b64 assets/hero-4.b64 assets/hero-5.b64; do
            echo "Decoding $f ($(wc -c < "$f") chars)"
            tr -d '\n\r ' < "$f" | base64 --decode >> assets/images/hero.webp
          done
          echo "Hero bytes: $(wc -c < assets/images/hero.webp)"

      - name: Materialize uploaded HQ section images when present
        shell: bash
        run: |
          for name in blueprint residence concept; do
            if compgen -G "assets/hqsrc/$name/*.b64" > /dev/null; then
              rm -f "assets/images/$name.webp"
              touch "assets/images/$name.webp"
              while IFS= read -r -d '' f; do
                tr -d '\n\r ' < "$f" | base64 --decode >> "assets/images/$name.webp"
              done < <(find "assets/hqsrc/$name" -maxdepth 1 -type f -name '*.b64' -print0 | sort -z)
            fi
          done

      - name: Validate reconstructed images
        shell: bash
        run: |
          test -s assets/images/hero.webp
          file assets/images/hero.webp
          ls -lh assets/images
          python - <<'PY'
          from PIL import Image
          im=Image.open('assets/images/hero.webp')
          print('hero dimensions:', im.size)
          assert im.size[0] >= 1600 and im.size[1] >= 900, im.size
          PY

      - name: Commit materialized images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images
          if git diff --cached --quiet; then
            echo "Images already materialized."
          else
            git commit -m "Rebuild Rekaz hero at full resolution"
            git push
          fi
