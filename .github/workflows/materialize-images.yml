name: Materialize Rekaz Images

on:
  push:
    paths:
      - '.github/workflows/materialize-images.yml'
      - 'assets/hero-*.b64'
      - 'assets/hqsrc/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create image directory
        run: mkdir -p assets/images

      - name: Rebuild HQ hero from continuous Base64 chunks
        shell: bash
        run: |
          cat assets/hero-0.b64 assets/hero-1.b64 assets/hero-2.b64 assets/hero-3.b64 assets/hero-4.b64 assets/hero-5.b64 \
            | tr -d '\n\r ' \
            | base64 --decode > assets/images/hero.webp

      - name: Materialize uploaded HQ section images when present
        shell: bash
        run: |
          for name in blueprint residence concept; do
            if compgen -G "assets/hqsrc/$name/*.b64" > /dev/null; then
              find "assets/hqsrc/$name" -maxdepth 1 -type f -name '*.b64' -print0 \
                | sort -z \
                | xargs -0 cat \
                | tr -d '\n\r ' \
                | base64 --decode > "assets/images/$name.webp"
            fi
          done

      - name: Keep current section fallbacks if HQ source is not present
        shell: bash
        run: |
          test -s assets/images/blueprint.webp || cp assets/blueprint.jpg assets/images/blueprint.jpg
          test -s assets/images/residence.webp || cp assets/residence.jpg assets/images/residence.jpg
          test -s assets/images/concept.webp || cp assets/concept.jpg assets/images/concept.jpg

      - name: Validate reconstructed hero
        shell: bash
        run: |
          test -s assets/images/hero.webp
          file assets/images/hero.webp
          ls -lh assets/images/hero.webp
          identify assets/images/hero.webp || true

      - name: Commit materialized images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images
          if git diff --cached --quiet; then
            echo "Images already materialized."
          else
            git commit -m "Rebuild Rekaz HQ images correctly"
            git push
          fi
